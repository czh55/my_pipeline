id: communicate-amateur-portrait-coaching
title: 素人人像引导：四维口令片场
domain: communicate
intent: 把「不自然」从性格问题改成可执行指令，快速建立安全感并预判成片
principle: 开门（测角破冰）→ 放入（部位口令+锚点）→ 关门（具体反馈）
steps:
  - name: 禁止开场「放松一点」
    detail: 用轻口令测上镜角（左转脸/右转脸）摸底，再摆姿。
  - name: 手脚无处放就给任务
    detail: 准备 2–3 件手持道具（书/花/耳机）；站位 + 道具任务立刻落地。
  - name: 口令写清部位与幅度
    detail: 每条指令含部位 + 方向/幅度 + 力度（如托腮分档），避免空泛形容词。
  - name: 给注视锚点
    detail: 指定楼窗/树梢等；侧脸时目光略偏镜头以保留瞳孔面积。
  - name: 反馈点名具体优势
    detail: 至少夸一个具体表现（角度/眼神/笑容）；网图骨骼做不到就换方案，不硬掰。
when_to_use: 约拍、帮朋友/家人拍照、非职业模特上镜紧张时。
boundaries: 未覆盖完整布光片场；专业模特可能不需同等密度口令；自然感来自引导到位后的预判，而非纯抓拍碰运气。
source: video-notes · guide-amateur-photo-fenjue《焚诀：如何引导素人拍照？》
status: validated
