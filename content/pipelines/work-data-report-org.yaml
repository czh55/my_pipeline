id: work-data-report-org
title: 数据分析型汇报材料组织
domain: work
intent: 让第一次阅读的人靠正文就能做判断，同时分项数据完整可查
principle: 通俗但不删数据；没有新定义词汇；顺着读者的疑问组织结构，而不是按照资料本身的结构
origin: self
steps:
  - name: 先写读者疑问（禁止先写目录）
    detail: 按 Q1–Q6 写清读者会问什么与必须交出的东西：结论与范围；尺子与缺口；3±1 条带数发现；差异拆解全表；不确定处；建议与数据锚点。写不全不开正文。
  - name: 按疑问装填（通俗，不删数）
    detail: 每个 Qi 先一句人话，再跟完整数据块（分项/原单位，可进附录但正文能指到），再一句「所以这意味着…」。禁止合并分项、只报涨跌不报基期、用未解释的综合指数代替算法。
  - name: 词表消毒
    detail: 只用日常汉语或读者岗位已默认会的词。候选新词三选一：删掉 / 换成旧词 / 改成一句描述。没看过资料的人读标题小标题，凡需口头解释的词一律改掉。
  - name: 按疑问重排
    detail: 正文顺序=Q1→Q6；资料原章节只当证据柜；映射不上的进附录或删结构（删结构不删数据）。
  - name: 交付三检
    detail: 检通俗不删数、无新词、疑问序；失败则补数、改词或按 Q1–Q6 重排。
summit: |
  待实践填充。硬原则保持原文：①通俗但不删数据；②没有新定义词汇，写给第一次阅读的人；③顺着读者的疑问组织结构，而不是按照资料本身的结构。
practice: []
when_to_use: 有数据要交代、读者多半第一次看、目标是「读完能做判断」——不是展示读过多少资料。
boundaries: 没有可核对数据时不要硬写「发现」；资料原目录不能直接当大纲。
source: 自己定义 · 2026-10-09 · 自 plan_100 误放讨论迁入
