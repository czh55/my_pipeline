id: create-on-camera-eye-expression
title: 上镜眼神：头眼分离与 45° 安全角
domain: create
intent: 解决看镜头无神、不看镜头翻白眼、微笑发假
principle: 开门（头控角度）→ 放入（眼珠独立）→ 关门（定住再换）
steps:
- name: 记住头眼分离
  detail: 头控角度，眼珠控视线；固定头，只用眼珠上下左右移动练控制。
- name: 偏视不超过 45°
  detail: 不看镜头时视线与镜头夹角 ≤45°（余光仍能瞥见镜头即大致安全）。
- name: 抬头垂眸、低头开眼
  detail: 抬头时眼珠略低找脑门延伸；低头时眼珠找地板延伸、瞳孔仍可见，避免闭眼。
- name: 微笑先眯眼再动嘴
  detail: 先感受卧蚕挤压成月牙，再让嘴巴跟上，避免嘴先咧的假笑。
- name: 定住再换点位
  detail: 每个点位数「一二三」定住再换；对镜循环抬头垂眸/低头开眼约 5 次。
practice: []
when_to_use: 日常自拍、他拍、写真等需要眼神的场景。
boundaries: 正式需直视的证件照不适用「偏视」；看向特定远方的主题拍摄另论。
