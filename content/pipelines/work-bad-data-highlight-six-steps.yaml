id: work-bad-data-highlight-six-steps
title: 烂数据汇报：六步找可讲亮点
domain: work
intent: 在真实数据下换视角呈现趋势与局部进展，而不是只认错或粉饰
principle: 开门（算环比同比）→ 放入（层层拆口径）→ 关门（讲清可行动方向）
steps:
- name: 先算环比
  detail: 本月 vs 上月，把第一个对比数算出来再开口。
- name: 环比不行看同比
  detail: 今年 vs 去年同期，找季节性或基数下的趋势。
- name: 拆业务线找局部上升
  detail: 按产品/备件/服务等拆到能找到增长的最细业务口径。
- name: 再拆财务角度
  detail: 毛利率、库存周转等财务指标可能露出局部进展。
- name: 引入可解释的效率指标
  detail: 仍无亮点则选真实可解释的效率类指标（如人均产能），并说明背景。
- name: 最后才动口径定义
  detail: 可定义合规口径（如异向客户数）；监管/审计场景禁止编造。
practice: []
when_to_use: 内部阶段性汇报，整体数字难看但需要讲清「下一步往哪走」。
boundaries: 只解决「怎么说真实数据」，不解决造假；长期靠含糊口径会损信任。
source: video-notes · bad-data-highlights《烂业绩数据也能讲出亮点｜六步法》
