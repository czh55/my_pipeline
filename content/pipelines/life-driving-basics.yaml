id: life-driving-basics
title: 开车（主题占位）
domain: life
intent: 把开车从紧张临场发挥，收成场景化检查与操作章程（待实践填充）
principle: 开门（出发前检查）→ 放入（按路况模板开）→ 关门（收车复盘）
steps:
- name: 出发前固定检查
  detail: 座椅/后视镜/安全带/档位/灯光… 清单待写成不会跳步的顺序。
- name: 按路况选模板
  detail: 城市拥堵 / 高速 / 夜间 / 雨天 / 停车入库…（各模板 1-2-3 待补）
- name: 预判优先于操作
  detail: 先看远处与两侧意图，再动方向与脚；细则待练。
- name: 情绪与疲劳熔断
  detail: 急躁或犯困时的强制停车规则（待定）。
- name: 收车短复盘
  detail: 今天哪个场景最虚，下次只练那一条。
summit: 待实践：各路况下预判优先于操作的具体检查点；安全始终压过章程完整度。
practice: []
when_to_use: 新手期、久未开、或想把「会开」变成「稳开」。
boundaries: 不替代驾校与法规；安全第一，章程服从现场法规与身体状态。
source: 用户主题清单 2026-10-07
