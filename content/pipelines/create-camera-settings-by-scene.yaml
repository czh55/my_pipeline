id: create-camera-settings-by-scene
title: 拍照相机设置：按场景走 1-2-3
domain: create
intent: 先按场景分类，再给每个场景固定的设置顺序，减少出门瞎拧参数
principle: 开门（认场景）→ 放入（按序设参）→ 关门（试拍确认）
steps:
  - name: 认场景
    detail: 室内人像 / 户外顺光 / 逆光 / 夜景 / 运动拖影…（场景表待补全）
  - name: 场景内第 1 步：曝光锚点
    detail: 先定谁正确曝光（脸 / 天空 / 主体高光），再动其余。（各场景细则待写）
  - name: 场景内第 2 步：景深与焦段
    detail: 光圈/距离/焦距服务主体分离还是环境交代。（待按场景填）
  - name: 场景内第 3 步：快门与稳定
    detail: 手持极限、是否需要三脚架/连拍/防抖。（待按场景填）
  - name: 试拍一张再锁定
    detail: 看直方图与成片意图，再批量拍；不边拍边无目的拧盘。
when_to_use: 出门前或到场后，需要快速进入「可拍状态」而不是研究菜单时。
boundaries: 不同机身菜单不同，章程记的是决策顺序，不是某一品牌键位教程。
source: 用户主题清单 2026-10-07
status: seed
tags: [摄影, 相机, 场景, 待完善]
