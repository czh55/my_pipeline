id: learn-daily-agent-pages
title: 日更学习页：选题 → Agent 精讲 → 校验 → Pages
domain: learn
intent: 用日历驱动，每天稳定产出一页可学内容（算法 / 歌词等），绝不发占位残页
principle: 开门（脚本选题）→ 放入（按模板写精讲）→ 关门（check + push main）
steps:
  - name: 跑选题脚本
    detail: algo：generate.py --bank；lyric：generate.py --prepare；读写 history 保证去重轮换。
  - name: 按方法论补齐内容
    detail: 算法走变量语义法（认型→三句→落码）；歌词按 lyric-learning-prompt 逐句精讲；缺精讲则 Agent 补全后再 --force。
  - name: 可选语音
    detail: edge-tts 生成当日讲解音频，挂到页面可播。
  - name: 强制校验
    detail: check_pages / finalize；algo 禁止日常 --allow-auto 占位页上线。
  - name: 提交日更
    detail: "更新 index、archive/lessons、history；commit 信息用 daily: YYYY-MM-DD → push main → 打开站点确认。"
when_to_use: 书房日课——需要「每天都有一页」的长期能力滚雪球时。
boundaries: 与 Webhook 媒体流水线不同；内容质量门禁优先于准时——写不出完整精讲就当天停更，不发空壳。
source: daily-algo（≈66 天, cron 08:00）+ daily-lyric-learning（≈72 课, cron 08:00）+ daily-photos 同构壳
status: snowball
tags: [日更, Automation, 算法, 歌词, 高频]
updated: "2026-10-07"
