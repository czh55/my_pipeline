id: life-cook-by-seasoning-and-dish
title: 做饭：调料用法 × 菜品类型
domain: life
intent: 用「调料怎么用」和「这道菜属于哪一类」两张表，把做饭从灵感变成可复用章程
principle: 开门（认菜类）→ 放入（按调料节奏下锅）→ 关门（调味收汁试吃）
steps:
  - name: 认菜类
    detail: 炒 / 煮 / 炖 / 蒸 / 凉拌 / 烤… 先归类，再选流程模板。（类别清单待补）
  - name: 备料按下锅顺序排
    detail: 耐煮在前、叶菜在后；酱料提前兑好，避免锅边手忙脚乱。
  - name: 调料按「底味→香气→提鲜→收口」
    detail: 例：盐糖酱油打底 → 葱姜蒜爆香 → 醋/料酒点睛 → 香油/辣椒油收口。（配比表待实践填）
  - name: 火候只服务这一类菜
    detail: 同是「炒」，滑炒与焦香火候不同；跟菜类模板，不跟心情。
  - name: 出锅前试吃一次
    detail: 只调一样（盐或酸或辣），避免连环加料失控。
when_to_use: 家常做饭想越做越稳、少靠「凭感觉晃瓶」时。
boundaries: 菜谱人人会看，味道差在实践次数——本条最容易触发易学错觉。
source: 用户主题清单 2026-10-07
status: seed
