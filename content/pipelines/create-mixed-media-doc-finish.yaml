id: create-mixed-media-doc-finish
title: 混媒纪录片收尾：配乐过渡 → 余韵结尾 → 统一色调
domain: create
intent: 多设备、多画质素材拼成一部片时，用可拼接的配乐、开放式结尾和「先参照再靠拢」的调色，让跳切变成叙事而不是穿帮
principle: 开门（定风格参照）→ 放入（过渡与统一）→ 关门（余韵落地）
steps:
  - name: 配乐先听硬切，再补过渡
    detail: 时间线标切入切出；硬切已顺就别加效果。跳的地方优先交叉淡入淡出 2–4 秒（尾音渐弱接前奏/安静句，避开双高点）；或淡出→静音 1–2 秒→淡入（情绪反差大时）。选曲阶段对齐调性/BPM/音色；两曲之间可插现场声当缓冲垫。
  - name: 结尾做余韵，不做总结陈词
    detail: 情绪顶点后再多留几秒「之后」细节；文字收在开放句；画面先切黑，音乐多走 5–8 秒淡出。忌字幕再煽一轮、总结旁白、高潮后立刻花絮。可试：慢细节画面→最后一句（≤15字）→切黑→音乐淡出。
  - name: 调色先定参照风格
    detail: 先想清温暖家庭感 / 冷调电影感 / 胶片味，选一张「感觉对了」的画面当参照，全片往它靠。
  - name: 基础统一再风格化
    detail: 先逐条矫正白平衡与曝光；再统一基础 LUT/预设（强度逐条微调）。差异极大时用颗粒、降饱和/黑白、统一暗角柔光「故意化」差异。按设备或场景分组组内统一→组间对比→全片风格层→盯切换处颜色跳。
  - name: 工具按差异选
    detail: 混素材统一色调优先达芬奇（节点分步、Qualifier/Power Window、Shot Match）；差异小、求快可用剪映。细调色节点见 create-davinci-modular-grade；手机肤色急救见 create-mobile-hsl-skin-rescue。
summit: |
  待实践：哪条过渡（crossfade / 静音间隙 / 现场声）在自己片子里最不突兀；余韵结构试拍后观众停在黑屏的体感秒数。
practice: []
when_to_use: 手机+相机+截图混剪、多首配乐、纪录片式家庭/旅行长片收尾时；与 create-pregnancy-newborn-doc 后半段配套。
boundaries: 不是「LUT 一套了事」；基础矫正没做完就上风格，差异会更脏。余韵不等于拖沓——黑屏+乐尾有上限，勿无限煽情。
source: 小红书「点点」对话截图 2026-10-08；原图 Downloads/0D8C77D8-….JPG
