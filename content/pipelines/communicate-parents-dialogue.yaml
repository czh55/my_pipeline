id: communicate-parents-dialogue
title: 父母沟通（主题占位）
domain: communicate
intent: 与父母沟通时减少顶牛与回避，形成可练习的对话章程（待填充）
principle: 开门（认议题类型）→ 放入（边界+关心并提）→ 关门（可执行约定）
steps:
- name: 认议题类型
  detail: 关心健康 / 干预选择 / 金钱 / 节日安排… 不同类型用不同模板（待分）。
- name: 先接住关心，再谈边界
  detail: 承认对方动机里的善意，再清晰说出自己的决定边界。
- name: 少讲道理，多给具体安排
  detail: 用时间、方案、备选代替抽象原则辩论。
- name: 冲突升级时换频道
  detail: 待补：暂停信号、改日再谈、引入第三方缓冲等。
- name: 留下可执行的小约定
  detail: 一次沟通只推进一件小事，滚雪球式建立信任。
summit: 待实践：哪类议题必须先接住关心、哪类必须先立边界；家庭差异大，不可照搬别人话术。
practice: []
when_to_use: 代际沟通反复卡在同一话题时。
boundaries: 强占位；家庭情况差异大，必须用亲身回合改写。
source: 用户主题清单 2026-10-07
status: seed
tags:
- 沟通
- 父母
- 待完善
