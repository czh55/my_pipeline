id: meta-enter-new-domain-with-ai
title: 快速进入新领域：AI 出草案 → 实践 → 按实情改 pipeline
domain: meta
intent: 进陌生领域时，先用多轮对话从 AI 逼出一般 pipeline，自己动手走一遍，再按真实情况改成可贴身的章程
principle: 开门（问出草案）→ 放入（亲自实践）→ 关门（按实情修订）
steps:
  - name: 直接问 AI，多轮把疑问问透
    detail: 不怕问得浅；围绕「目标 / 常见步骤 / 坑 / 我该先做什么」连续追问，逼出一条可照做的一般 pipeline（山底地图），而不是只收集名词。
  - name: 自己实践
    detail: 按草案真做一轮或数轮；深度只来自动手。此步不可跳过——AI 章程再完整也不能替你爬到山顶。
  - name: 按自己的实际情况完善 pipeline
    detail: 记下哪一步用得上、哪一步多余、缺了哪一步；改写成自己的 YAML（边界、工具、节奏），再归档进本仓库。
when_to_use: 接触摄影/咖啡/装修/职场新题等任何「还没有亲身章程」的新领域时。
boundaries: AI 给出的是一般草案（山底），不是你的最终版；完善前至少要有实践痕迹，否则仍停留在易学错觉。与 life-renovation-toc-as-pipeline「拿来目录再改」同构，只是入口从书换成多轮对话。
source: 用户口述 2026-10-08
status: draft
tags: [入门, AI, 实践, 修订]
updated: "2026-10-08"
