id: work-sudden-demand-slot-park
title: 应对突发需求：先稳 → 槽内存档 → 事后补齐
domain: work
intent: 突发插入时不急躁、不丢线：把当前与近期事项先安进「槽」里留存，做完突发后再在舒缓时段补齐，用周期内松紧平衡代替每天一样紧
principle: 开门（不急躁）→ 放入（事项入槽）→ 关门（节奏回补）
steps:
  - name: 不急躁
    detail: 先稳住呼吸与注意力；急躁只会同时丢掉「正在做的」和「突发的」两边质量。允许自己用几十秒确认：这是插入，不是世界崩了。
  - name: 当前与近期事项入槽留存
    detail: 快速梳理手头与近期待办，写进明确的槽位（今日未完 / 本周待办 / 已约时间块），状态与下一步动作各记一句，避免只靠脑子硬扛导致遗漏。
  - name: 切换做突发事项
    detail: 入槽完成后再全力处理突发；切换时心里清楚「被停住的事已经有位置」，降低焦虑驱动的多线程乱切。
  - name: 舒缓时段补齐槽内事项
    detail: 突发结束后，选节奏相对松的时段（当日尾声、次日上午、本周缓冲块）按槽位逐条补齐或改期，不默认「做完突发等于可以忘掉被挤掉的事」。
  - name: 用周期松紧做平衡，不追求天天天天一样
    detail: 一周/一月内，每天松紧本来就不会均匀；紧日靠入槽保不失，松日靠回补还债。调节的是周期平衡，不是强迫每日同强度。
when_to_use: 老板/客户/家庭突然插单、原计划被打断、容易又慌又怕漏事时。
boundaries: 入槽不是拖延突发；真正紧急且不可延后的事项仍优先处理，但「入槽」这一步尽量压成一两分钟。也不等于无限承接一切突发——周期过载时要显式砍范围或求助。
source: 用户口述 2026-10-08
status: draft
tags: [突发, 节奏, 待办, 平衡]
