id: create-mobile-hsl-skin-rescue
title: 手机剪辑救黑黄皮：全局 → HSL 橙 → 塑形
domain: create
intent: 室内蜡黄发暗时，用基础参数 + HSL 把肤色拉回清透
principle: 开门（全局打底）→ 放入（橙通道去黄提亮）→ 关门（塑形+冷色温）
steps:
  - name: 全局打底
    detail: 提亮度、略降对比（奶油感）、加饱和，微调光感/锐化。
  - name: HSL 橙色去黄提亮
    detail: 降橙色色调/饱和度去黄，再提橙色亮度——皮肤主要由橙色通道控制。
  - name: 逐色修环境色
    detail: 衣服/水果/背景各色单独调，避免只有脸干净、环境发脏。
  - name: 高光阴影塑形
    detail: 微调高光/阴影增加立体层次，避免全局后画面扁平。
  - name: 冷色温收尾
    detail: 略偏冷收束清透感；顺序坚持「全局→HSL→高光阴影→色温」，勿一步全局色温糊弄。
when_to_use: 室内暖光/混合光人物视频、手机自拍「人比实际黄」的画面。
boundaries: 户外强光充足画面不是提亮题；刻意暖黄怀旧风不要硬救成冷白皮。
source: video-notes · 3n3p9zsXLp2《新手必看🔥如何拯救黑黄视频？》；video 集群约 133
status: validated
