id: life-freestyle-relaxed-distance
title: 自由泳省力远游：腿位 → 划程 → 侧换气
domain: life
intent: 游不远先查阻力与耗氧习惯，而不是只怪体力
principle: 开门（拍腿位自检）→ 放入（拉长行程）→ 关门（侧头换气）
steps:
- name: 侧面/水下拍腿位
  detail: 请人拍一段，看腿是贴近水面还是明显下沉；腿沉会显著增阻。
- name: 拉长划水行程
  detail: 刻意手臂前伸抱水，把每一划拉满；避免行程过短、只靠加快划频。
- name: 侧转头换气
  detail: 提醒自己侧转头而非抬头「救命式」换气，保持身体水平、下巴放松。
- name: 力竭先查三细节
  detail: 25–50m 即力竭时，先查腿位、划程、换气节奏，再考虑加练耐力。
- name: 陆上补移肩
  detail: 手肘相对固定，练肩胛前伸/后缩；下水前池边重复再慢游送肩。
practice: []
when_to_use: 业余想游得轻松、距离更长时。
boundaries: 不覆盖竞技转身滚翻等细节；行程太短会像狗刨，节奏过快也会耗氧过快，两端都要避。
