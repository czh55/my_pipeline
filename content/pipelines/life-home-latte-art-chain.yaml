id: life-home-latte-art-chain
title: 居家拉花全链路：浓缩 → 奶泡 → 融合 → 出图
domain: life
intent: 把拉花从「手感玄学」拆成可核对的前置链与倒缸时序
principle: 开门（萃取合格浓缩）→ 放入（奶泡与融合）→ 关门（出图收流）
steps:
  - name: 萃取适合拉花的浓缩
    detail: 意式中深烘、养豆约 10–15 天；粉约 18.5–20g、88–90℃、23–30s、液重比约 1:1.5–1.7；用流速三态调磨，不纠结刻度。
  - name: 打发奶泡到约 65℃
    detail: 冷藏全脂巴氏奶；打奶缸/全能缸；等蒸汽变强再计进气；打棉阶段勿乱动防二次进气。
  - name: 先练融合再出图
    detail: 折杯、高融合约 5–10cm、椭圆形大面积快速融合；液面干净前不出图案。
  - name: 出图与收流
    detail: 贴面出图；大白心示例于中心偏下注入，收尾抬高约 5cm 微翘收流；摆动宜轻、靠后三指匀速。
  - name: 异常先救地基
    detail: 油水分离可预融合救液面；融合轨迹用慢动作回放自检是否椭圆、是否贴底。
when_to_use: 有家用意式机+电磨，想稳定练出干净液面与基础图案时。
boundaries: 玩具机/玩具磨不适用；图案课不能替代奶泡与融合品质问题。
source: video-notes · espresso-extraction-latte / latte-froth-lesson2 / latte-art-integration / swing-tutorial 等；coffee 约 53
