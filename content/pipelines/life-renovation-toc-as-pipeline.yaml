id: life-renovation-toc-as-pipeline
title: 装修：把书的目录当成 pipeline 骨架
domain: life
intent: 同一主题不同作者有不同目录；先拿来主义当骨架，边学边做，再沉淀自己的目录结构
principle: 开门（借目录）→ 放入（实践改写）→ 关门（收成自己的 TOC）
steps:
- name: 选 1–2 本靠谱框架书
  detail: 先抄目录，不先抄细节技巧；目录=阶段划分候选。
- name: 把目录改写成阶段 pipeline
  detail: 每章变成：目标 / 输入 / 决策点 / 产出 / 常见坑。（例：需求→设计→拆改→水电→泥木…）
- name: 边做边标注「我的版本」
  detail: 哪一步书上有但自己用不上、哪一步书上没有但现场必需——写进自己的 YAML。
- name: 决策点单独列表
  detail: 预算、风格、收纳、工期、住不住人施工… 每个决策点有选项与代价。
- name: 收工后定稿自己的 TOC
  detail: 下次装修/局部改造只带自己的目录上山，不再从零找书。
summit: 待实践：从借来的书目录里删掉哪些章、补上哪些现场决策点，收工后才定稿「我的 TOC」。
practice: []
when_to_use: 装修、局部改造、或任何「书很多但不知道按啥顺序做」的大项目。
boundaries: 目录能帮山底上路，不能替代工地实践；不同城市工艺与规范不同，必须本地化。
source: 用户主题清单 2026-10-07（核心方法：目录即 pipeline）
status: seed
tags:
- 装修
- 目录
- 拿来主义
- 待完善
updated: '2026-10-07'
